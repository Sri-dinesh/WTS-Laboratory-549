<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Header — VCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #111827;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .logo-badge {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: #18181b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
        }
        .brand-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #111827;
            line-height: 1.2;
        }
        .brand-subtitle {
            font-size: 0.7rem;
            color: #6b7280;
            font-weight: 500;
        }
        .divider {
            width: 1px;
            height: 28px;
            background: #e5e7eb;
            margin: 0 20px;
            flex-shrink: 0;
        }
        .ticker-wrap {
            flex: 1;
            overflow: hidden;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
        }
        .ticker-pill {
            background: #18181b;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .ticker-content {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .ticker-content span {
            display: inline-block;
            font-size: 0.8rem;
            color: #4b5563;
            font-weight: 500;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 22s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .back-portal {
            margin-left: 16px;
            flex-shrink: 0;
            font-size: 0.78rem;
            font-weight: 600;
            color: #374151;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        .back-portal:hover {
            color: #111827;
            border-color: #d1d5db;
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="logo-badge">VCE</div>
        <div class="brand-text">
            <span class="brand-title">Vardhaman College of Engineering</span>
            <span class="brand-subtitle">Autonomous Institution · Affiliated to JNTUH</span>
        </div>
    </div>

    <div class="divider"></div>

    <div class="ticker-wrap">
        <span class="ticker-pill">Notice</span>
        <div class="ticker-content">
            <span>Admissions Open for Academic Year 2024-25 · NAAC Accredited A++ Grade · NBA Accredited Engineering Programs · Placement Drives in Progress</span>
        </div>
    </div>

    <a href="../index.html" target="_top" class="back-portal">← Lab Portal</a>
</body>
</html>
