<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery — VCE</title>

</head>

        <div class="page-header">
            <h2>Campus Infrastructure Gallery</h2>
        </div>

            </div>
            <div class="gallery-item">

                <div class="gallery-caption">Digital Central Library</div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?w=500&h=350&fit=crop" alt="Campus Grounds">

</html>
