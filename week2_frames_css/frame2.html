<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation — VCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: #ffffff;
            color: #0f172a;
            padding: 20px 12px;
            border-right: 1px solid #e2e8f0;
            min-height: 100vh;
        }
        .nav-header {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #94a3b8;
            padding: 0 12px;
            margin-bottom: 12px;
        }
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            font-size: 0.86rem;
            font-weight: 600;
            color: #475569;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        a:hover {
            color: #0d9488;
            background: #f0fdfa;
            transform: translateX(3px);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        a:hover .nav-icon {
            background: #ccfbf1;
            color: #0d9488;
        }
        .meta-footer {
            margin-top: 40px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.72rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="nav-header">Campus Menu</div>
    <nav class="nav-list">
        <a href="frame3.html" target="content">
            <div class="nav-icon">🏛️</div>
            <span>Home Portal</span>
        </a>
        <a href="intro.html" target="content">
            <div class="nav-icon">📖</div>
            <span>Introduction</span>
        </a>
        <a href="dept.html" target="content">
            <div class="nav-icon">🔬</div>
            <span>Departments</span>
        </a>
        <a href="gallery.html" target="content">
            <div class="nav-icon">🖼️</div>
            <span>Campus Gallery</span>
        </a>
        <a href="feedback.html" target="content">
            <div class="nav-icon">💬</div>
            <span>Feedback Form</span>
        </a>
        <a href="address.html" target="content">
            <div class="nav-icon">📍</div>
            <span>Contact &amp; Address</span>
        </a>
    </nav>

    <div class="meta-footer">
        <strong>Week 02</strong> · HTML Frames
    </div>
</body>
</html>
