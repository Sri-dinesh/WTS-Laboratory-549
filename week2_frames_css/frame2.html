<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation — VCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #111827;
            padding: 24px 16px;
            border-right: 1px solid #e5e7eb;
            min-height: 100vh;
        }
        .nav-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
            padding: 0 12px;
            margin-bottom: 12px;
        }
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            font-size: 0.86rem;
            font-weight: 500;
            color: #4b5563;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        a:hover {
            color: #111827;
            background: #f3f4f6;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #9ca3af;
            flex-shrink: 0;
        }
        a:hover .dot {
            background: #111827;
        }
        .meta-footer {
            margin-top: 48px;
            padding: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.72rem;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="nav-label">Navigation</div>
    <nav class="nav-list">
        <a href="frame3.html" target="content">
            <span class="dot"></span>
            <span>Home Portal</span>
        </a>
        <a href="intro.html" target="content">
            <span class="dot"></span>
            <span>Introduction</span>
        </a>
        <a href="dept.html" target="content">
            <span class="dot"></span>
            <span>Departments</span>
        </a>
        <a href="gallery.html" target="content">
            <span class="dot"></span>
            <span>Campus Gallery</span>
        </a>
        <a href="feedback.html" target="content">
            <span class="dot"></span>
            <span>Feedback Form</span>
        </a>
        <a href="address.html" target="content">
            <span class="dot"></span>
            <span>Contact &amp; Address</span>
        </a>
    </nav>

    <div class="meta-footer">
        <strong>Week 02</strong> · Nested Frames
    </div>
</body>
</html>
