<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Submitted — Week 03</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --shadow-card: 0 20px 25px -5px rgba(16, 185, 129, 0.1), 0 8px 10px -6px rgba(16, 185, 129, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.08) 0px, transparent 60%);
        }

        .success-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            box-shadow: var(--shadow-card);
            padding: clamp(36px, 6vw, 56px);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .success-ring {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #dcfce7;
            border: 2px solid #86efac;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin: 0 auto 24px;
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.2);
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .ref-box {
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 32px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .ref-box strong {
            color: #0f172a;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            display: block;
            padding: 12px 24px;
            background: #16a34a;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .btn-secondary {
            display: block;
            padding: 12px 24px;
            background: #ffffff;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="success-ring">✓</div>
    <h1>Application Submitted!</h1>
    <p>Thank you for submitting your job registration. Your credentials and uploaded resume have been safely recorded.</p>
    
    <div class="ref-box">
        Application Reference ID: <strong>APP-2024-VCE8605</strong>
    </div>

    <div class="actions">
        <a href="index.html" class="btn-primary">Submit Another Response</a>
        <a href="../index.html" class="btn-secondary">← Back to Lab Portal</a>
    </div>
</div>

</body>
</html>
